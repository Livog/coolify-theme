name: Coolify release check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue for an unbuilt Coolify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/coollabsio/coolify/releases/latest --jq '.tag_name | ltrimstr("v")')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected Coolify tag: $version"; exit 1; }
          if jq -e --arg v "$version" 'index($v) != null' dist/versions.json > /dev/null; then
            echo "Coolify $version already has a theme build"
            exit 0
          fi
          title="Coolify v$version released"
          if [ "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq length)" != "0" ]; then
            echo "Issue already exists for Coolify $version"
            exit 0
          fi
          gh issue create --title "$title" --body "Coolify v$version is out. Until it has its own build, installs on v$version use the newest older theme build.

          Check the theme against v$version, then run \`bun run build.ts $version\` and push."
